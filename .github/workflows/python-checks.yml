name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      # Rust's abi3-py311 bindings can use the runner's system Python 3.12.
      PYO3_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and Clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  lint-and-types:
    # Match local development without installing the Linux-only CUDA runtime.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Sync GPU library type interfaces
        run: uv run --no-sync python scripts/sync_type_libraries.py
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync ty check
