[workspace]
members = ["crates/resin-core", "crates/resin-http", "crates/resin-recipe", "crates/resin-py"]
resolver = "3"

[workspace.dependencies]
prometheus-client = { version = "0.25.1", features = ["prometheus_protobuf", "protobuf-protox"] }
prost = "0.14"
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck", "unaligned", "little_endian", "pointer_width_32"] }
serde = { version = "1", features = ["derive"] }
