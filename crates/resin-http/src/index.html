<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="resin-dp-size" content="1">
  <title>Resin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js"></script>
  <style>
    :root { color-scheme:light dark; font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif; --line:#8884; --muted:#888; --accent:#2563d9; --soft:#8881 }
    * { box-sizing:border-box }
    html { scrollbar-gutter:stable }
    body { max-width:880px; min-height:100dvh; margin:0 auto; padding:24px 20px 18px; display:flex; flex-direction:column; background:Canvas; color:CanvasText }
    header { position:sticky; top:0; z-index:2; display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-top:-24px; padding:24px 0 12px; background:Canvas }
    header::after,footer::before { content:""; position:absolute; left:0; right:0; height:24px; opacity:0; pointer-events:none; transition:opacity .15s }
    header::after { top:100%; background:linear-gradient(to bottom,Canvas,transparent) }
    footer::before { bottom:100%; background:linear-gradient(to bottom,transparent,Canvas) }
    body.can-scroll-up header::after,body.can-scroll-down footer::before { opacity:1 }
    h1 { font-size:23px; letter-spacing:-.025em; margin:0 } .muted,#stats { color:var(--muted) }
    #model { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    #chat-shell { min-width:0; flex:1 0 auto; display:flex; flex-direction:column }
    #chat { min-width:0; flex:1 0 auto; display:flex; flex-direction:column; gap:18px; padding:18px 3px 26px }
    #empty-state { margin:auto; display:grid; justify-items:center; gap:5px; color:var(--muted); font-size:13px; opacity:.72; user-select:none }
    #empty-state svg { width:140px; height:auto; transform:translateX(-5px); overflow:visible }
    #empty-state svg path { fill:currentColor }
    .turn { min-width:0; border-radius:15px; padding:14px 17px; overflow-wrap:anywhere }
    .user { align-self:flex-end; width:fit-content; max-width:min(65%,760px); background:var(--soft); white-space:pre-wrap }
    .assistant { width:100%; padding:17px 0 }
    .markdown { min-width:0; max-width:100% }
    .markdown > :first-child { margin-top:0 } .markdown > :last-child { margin-bottom:0 }
    .markdown p { margin:.7em 0 } .markdown h1,.markdown h2,.markdown h3 { line-height:1.25; margin:1.15em 0 .45em }
    .markdown h1 { font-size:1.45em } .markdown h2 { font-size:1.25em } .markdown h3 { font-size:1.08em }
    .markdown ul,.markdown ol { margin:.6em 0; padding-left:1.5em }
    .markdown blockquote { margin:.8em 0; padding:.1em 0 .1em 1em; border-left:3px solid var(--line); color:var(--muted) }
    .markdown hr { border:0; border-top:1px solid var(--line); margin:1.3em 0 }
    .table-wrap { width:100%; max-width:100%; overflow-x:auto; margin:.9em 0 }
    .markdown table { width:100%; border-collapse:collapse; font-size:.95em }
    .markdown th,.markdown td { padding:.45em .7em; border:1px solid var(--line); text-align:left; vertical-align:top }
    .markdown th { background:var(--soft); font-weight:650 }
    .markdown .align-center { text-align:center } .markdown .align-right { text-align:right }
    code { font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--soft); border-radius:5px; padding:.15em .35em }
    pre { max-width:100%; overflow:auto; margin:.9em 0; padding:13px 15px; border:1px solid var(--line); border-radius:10px; background:var(--soft) }
    pre code { background:none; padding:0 } a { color:var(--accent) }
    details { min-width:0; color:var(--muted); margin:0 3px -5px }
    details summary { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-weight:400; list-style:none }
    details summary::-webkit-details-marker { display:none }
    details summary::before { content:""; flex:0 0 6px; width:6px; height:6px; border-right:1px solid currentColor; border-bottom:1px solid currentColor; transform:rotate(-45deg); transition:transform .15s }
    details[open] > summary::before { transform:translateY(-2px) rotate(45deg) }
    details.pending summary { animation:pulse 1.4s ease-in-out infinite }
    details .markdown { padding:7px 3px 2px }
    .assistant:empty { display:none }
    footer { min-width:0; position:sticky; bottom:0; z-index:2; margin-bottom:-18px; padding:9px 0 18px; background:Canvas }
    #stats { min-height:24px; margin:0 3px 8px; font-size:13px }
    #attachments { display:flex; gap:8px; overflow-x:auto; margin:0 3px 8px; padding:2px }
    #attachments[hidden] { display:none }
    .attachment { position:relative; flex:0 0 76px; height:76px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--soft) }
    .attachment img { width:100%; height:100%; display:block; object-fit:cover }
    .attachment button { position:absolute; top:4px; right:4px; width:22px; height:22px; border:1px solid #fff8; border-radius:50%; padding:0; background:#111b; color:white; font:16px/18px system-ui }
    .user-media { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:9px }
    .user-media img { display:block; width:min(180px,100%); max-height:240px; border-radius:10px; object-fit:cover }
    .user-text:empty { display:none }
    #settings { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:8px; padding:11px 13px 12px; border:1px solid var(--line); border-radius:14px }
    #settings[hidden] { display:none }
    #settings label { display:grid; gap:4px; color:var(--muted); font-size:12px; font-weight:600 }
    #settings input,#settings select { width:100%; height:34px; border:1px solid var(--line); border-radius:9px; padding:0 9px; background:Canvas; color:CanvasText; font:14px/1 ui-sans-serif,system-ui,-apple-system,sans-serif }
    form { display:flex; align-items:flex-end; gap:8px; padding:7px 7px 7px 13px; border:1px solid var(--line); border-radius:17px; background:Canvas }
    textarea { flex:1; min-height:38px; min-width:0; max-height:160px; resize:none; border:0; outline:0; padding:8px 2px; background:transparent; color:inherit; font:inherit; line-height:22px }
    button { flex:0 0 38px; width:38px; height:38px; border:0; border-radius:11px; background:var(--accent); color:white; font:700 20px/1 system-ui; cursor:pointer }
    form > button { display:grid; place-items:center; padding:0; transition:background-color .15s }
    form > button svg { display:block; width:20px; height:20px }
    #attach svg,#settings-toggle svg { width:18px; height:18px }
    #attach,#settings-toggle { background:var(--soft); color:CanvasText }
    #settings-toggle[aria-expanded="true"] { color:var(--accent) }
    form > button:hover:not(:disabled) { background:color-mix(in srgb,var(--accent) 88%,CanvasText) }
    #attach:hover:not(:disabled),#settings-toggle:hover:not(:disabled) { background:#8883 }
    .attachment button:hover { filter:brightness(1.08) } button:disabled { opacity:.45; cursor:wait }
    @keyframes pulse { 50% { opacity:.5 } }
    @media (max-width:600px) { body { padding:16px 12px 10px } header { margin-top:-16px; padding:16px 0 8px } footer { margin-bottom:-10px; padding-bottom:10px } .user { max-width:85% } .assistant { padding:14px 0 } #settings { grid-template-columns:repeat(2,minmax(0,1fr)) } textarea,#settings input,#settings select { font-size:16px } }
  </style>
</head>

function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}

  return out.join('');
}
function renderRich(element,text){const follow=atChatBottom();element.innerHTML=renderMarkdown(text);if(window.renderMathInElement)renderMathInElement(element,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false});scrollChat(follow)}
function parseSse(buffer,onData){let cut;while((cut=buffer.indexOf('\n\n'))>=0){const block=buffer.slice(0,cut);buffer=buffer.slice(cut+2);for(const line of block.split('\n'))if(line.startsWith('data: '))onData(line.slice(6))}return buffer}
function resizePrompt(){prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,160)+'px'}
prompt.addEventListener('input',resizePrompt);
window.addEventListener('scroll',updateScrollFades,{passive:true});
window.addEventListener('resize',updateScrollFades);
new ResizeObserver(updateScrollFades).observe(document.body);
updateScrollFades();
settingsToggle.addEventListener('click',()=>{settings.hidden=!settings.hidden;settingsToggle.setAttribute('aria-expanded',String(!settings.hidden))});
attach.addEventListener('click',()=>imageInput.click());
imageInput.addEventListener('change',async()=>{const files=[...imageInput.files];imageInput.value='';let error='';for(const file of files){if(pendingImages.length>=maxImages){error=`Attach at most ${maxImages} images`;break}if(!supportedImageTypes.has(file.type)){error=`Unsupported image type: ${file.type||file.name}`;continue}if(file.size>maxImageBytes){error=`${file.name} is larger than 8 MiB`;continue}if(pendingImages.reduce((total,image)=>total+image.size,0)+file.size>maxImageBytes){error='Attached images total more than 8 MiB';break}try{pendingImages.push({name:file.name,size:file.size,url:await readDataUrl(file)})}catch(err){error=err.message}}renderAttachments();stats.textContent=error});
form.addEventListener('submit',async e=>{
  e.preventDefault();if(send.disabled)return;const text=prompt.value.trim(),images=pendingImages;if(!text&&!images.length)return;
  pendingImages=[];renderAttachments();prompt.value='';resizePrompt();send.disabled=true;attach.disabled=true;stats.textContent='';userTurn(text,images);
  const content=images.length?[...images.map(image=>({type:'image_url',image_url:{url:image.url}})),...(text?[{type:'text',text}]:[])]:text;
  const historyLength=history.length;history.push({role:'user',content});
  const box=turn('assistant'),thinking=document.createElement('details'),summary=document.createElement('summary'),reasonBox=document.createElement('div');
  reasonBox.className='markdown';thinking.className='pending';thinking.open=true;thinking.append(summary,reasonBox);box.before(thinking);
  const requestStartedAt=performance.now();
  const updatePending=()=>{if(thinking.isConnected&&thinking.classList.contains('pending'))summary.textContent=`Waiting for first token… ${((performance.now()-requestStartedAt)/1000).toFixed(1)}s`};
  updatePending();const statusTimer=setInterval(updatePending,250);
  let answer='',reason='',generationStartedAt=null,finishReason=null;
  try {
    const request={model:modelEl.textContent,messages:history,temperature:Number(temperature.value),top_p:Number(topP.value),stream:true,stream_options:{include_usage:true}};
    const maxOutput=Number(maxOutputTokens.value);if(maxOutput>0)request.max_completion_tokens=maxOutput;
    request.routed_dp_rank=conversationRank;
    if(reasoningEffort.value==='off')request.enable_thinking=false;
    else if(reasoningEffort.value)request.reasoning_effort=reasoningEffort.value;
    const response=await fetch('/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(request)});
    if(!response.ok)throw new Error((await response.json()).error?.message||response.statusText);
    const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',completed=false;
    while(!completed){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});buffer=parseSse(buffer,data=>{
      if(data==='[DONE]'){completed=true;return}const event=JSON.parse(data);if(event.error)throw new Error(event.error.message||'The inference request failed');const delta=event.choices?.[0]?.delta||{};
      finishReason=event.choices?.[0]?.finish_reason||finishReason;
      if(delta.reasoning_content||delta.content)generationStartedAt??=performance.now();
      if(delta.reasoning_content){reason+=delta.reasoning_content;summary.textContent='Reasoning';thinking.classList.remove('pending');renderRich(reasonBox,reason);thinking.open=true}
      if(delta.content){if(!reason)thinking.remove();answer+=delta.content;renderRich(box,answer)}
      if(event.resin){const r=event.resin,now=performance.now();if(!reason&&!answer)thinking.remove();const generationMs=r.generation_elapsed_ms>0?r.generation_elapsed_ms:(generationStartedAt===null?r.elapsed_ms:now-generationStartedAt);const observedTtftMs=generationStartedAt===null?r.time_to_first_token_ms:generationStartedAt-requestStartedAt;const rate=generationMs>0?r.completion_tokens*1000/generationMs:0;const stopNote=finishReason==='length'?' · max output reached':'';stats.textContent=`${r.prompt_tokens} prompt + ${r.completion_tokens} generated tokens · ${rate.toFixed(1)} tok/s · ${(generationMs/1000).toFixed(2)} s generation · ${(observedTtftMs/1000).toFixed(2)} s TTFT${stopNote}`}
    });if(done)break}
    if(!completed)throw new Error('The inference stream ended before completion');
    history.push({role:'assistant',content:answer,...(reason?{reasoning_content:reason}:{})});
  } catch(err) {history.length=historyLength;if(!reason)thinking.remove();box.textContent='Error: '+err.message}
  finally {clearInterval(statusTimer);if(thinking.classList.contains('pending'))thinking.remove();send.disabled=false;attach.disabled=false;prompt.focus()}
});
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
