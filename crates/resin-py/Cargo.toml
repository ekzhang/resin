[package]
name = "resin-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Python bindings for the Resin inference engine"

[lib]
name = "_resin"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311", "experimental-inspect"] }
pythonize = "0.29"
resin-core = { path = "../resin-core" }
resin-http = { path = "../resin-http" }
resin-recipe = { path = "../resin-recipe" }
rkyv.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
